<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Practice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.15s ease;
            overflow: hidden;
        }

        /* =========================
           GREEN FLASH - CORRECT
           ========================= */

        body.flash-green {
            animation: greenFlash 1.6s ease-in-out 1;
        }

        @keyframes greenFlash {
            0%, 100% {
                background-color: #f4f6f8;
            }

            7.5% {
                background-color: #32cd32;
            }

            15% {
                background-color: #f4f6f8;
            }

            22.5% {
                background-color: #32cd32;
            }

            30% {
                background-color: #f4f6f8;
            }

            37.5% {
                background-color: #32cd32;
            }

            45% {
                background-color: #f4f6f8;
            }

            52.5% {
                background-color: #32cd32;
            }

            60% {
                background-color: #f4f6f8;
            }

            67.5% {
                background-color: #32cd32;
            }

            75% {
                background-color: #f4f6f8;
            }

            82.5% {
                background-color: #32cd32;
            }

            90% {
                background-color: #f4f6f8;
            }
        }

        /* =========================
           RED FLASH - WRONG
           ========================= */

        body.flash-red {
            animation: redFlash 0.8s ease-in-out 1;
        }

        @keyframes redFlash {
            0%, 100% {
                background-color: #f4f6f8;
            }

            15% {
                background-color: #ff3b30;
            }

            30% {
                background-color: #f4f6f8;
            }

            45% {
                background-color: #ff3b30;
            }

            60% {
                background-color: #f4f6f8;
            }
        }

        /* =========================
           MAIN CONTAINER
           ========================= */

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 700px;
            position: relative;
            z-index: 2;
        }

        h1 {
            margin-bottom: 25px;
            color: #333;
        }

        /* =========================
           TIMES TABLE SELECTOR
           ========================= */

        .table-label {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }

        .table-selector {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 30px;
        }

        .table-selector button {
            width: 48px;
            height: 42px;
            border: 2px solid #333;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #eee;
            color: #333;
        }

        .table-selector button:hover {
            background: #ddd;
        }

        .table-selector button.active {
            background: #333;
            color: white;
        }

        /* =========================
           EQUATION
           ========================= */

        .equation {
            font-size: 42px;
            font-weight: bold;
            margin: 35px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .answer-input {
            width: 110px;
            height: 60px;
            font-size: 34px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #888;
            border-radius: 6px;
        }

        .answer-input:focus {
            outline: none;
            border-color: #333;
        }

        .answer-input::-webkit-inner-spin-button,
        .answer-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* =========================
           ACTION BUTTONS
           ========================= */

        .actions button {
            padding: 13px 30px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px;
        }

        #submitBtn {
            background: #333;
            color: white;
        }

        #submitBtn:hover {
            background: #555;
        }

        #generateBtn {
            background: #ddd;
            color: #333;
        }

        #generateBtn:hover {
            background: #ccc;
        }

        #generateBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           MESSAGE
           ========================= */

        #message {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            min-height: 28px;
        }

        .correct {
            color: green;
        }

        .incorrect {
            color: red;
        }

        /* =========================
           FIREWORKS
           ========================= */

        #fireworks {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .firework {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .spark {
            position: absolute;
            left: 0;
            top: 0;
            width: 6px;
            height: 22px;
            border-radius: 50%;
            transform-origin: 50% 100%;
            animation: sparkFly 850ms ease-out forwards;
        }

        @keyframes sparkFly {
            0% {
                transform:
                    rotate(var(--angle))
                    translateY(0)
                    scaleY(0.2);
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                transform:
                    rotate(var(--angle))
                    translateY(var(--distance))
                    scaleY(1);
                opacity: 0;
            }
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 28px;
            }

            .table-selector button {
                width: 42px;
                height: 38px;
                font-size: 15px;
            }

            .equation {
                font-size: 30px;
                gap: 8px;
            }

            .answer-input {
                width: 80px;
                height: 50px;
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div id="fireworks"></div>

<div class="container">

    <h1>Division Practice</h1>

    <div class="table-label">
        Choose a times table
    </div>

    <div class="table-selector">

        <button data-table="2">2</button>
        <button data-table="3" class="active">3</button>
        <button data-table="4">4</button>
        <button data-table="5">5</button>
        <button data-table="6">6</button>
        <button data-table="7">7</button>
        <button data-table="8">8</button>
        <button data-table="9">9</button>
        <button data-table="10">10</button>
        <button data-table="11">11</button>
        <button data-table="12">12</button>

    </div>

    <div class="equation" id="equation"></div>

    <div class="actions">

        <button id="submitBtn">
            Submit
        </button>

        <button id="generateBtn" disabled>
            Generate
        </button>

    </div>

    <div id="message"></div>

</div>


<script src="util.js"></script>

<script>

    /*
     * ==========================================
     * GAME STATE
     * ==========================================
     */

    let selectedTable = 3;

    let correctAnswer = 0;

    let answerSubmitted = false;

    let lastEffectAnswer = null;


    /*
     * ==========================================
     * PERSISTED STATE
     * ==========================================
     *
     * Keeps the in-progress question for each
     * times table, so refreshing the page or
     * switching tables and back does not let
     * the user skip an unanswered question.
     */

    const STORAGE_KEY = "divisionPracticeState";


    function loadState() {

        try {

            const raw =
                localStorage.getItem(STORAGE_KEY);

            return raw ? JSON.parse(raw) : {};

        } catch (e) {

            return {};
        }
    }


    function saveState(state) {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(state)
            );

        } catch (e) {}
    }


    function saveCurrentProblem(table) {

        const state = loadState();

        if (!state.problems) {

            state.problems = {};
        }

        state.problems[table] = {
            correctAnswer: correctAnswer,
            equationHTML:
                document.getElementById("equation").innerHTML
        };

        state.selectedTable = table;

        saveState(state);
    }


    /*
     * ==========================================
     * GENERATE QUESTION
     * ==========================================
     *
     * The selected table is always involved.
     *
     * Example with table 3:
     *
     * 9 ÷ 3 = ?
     *
     * ? ÷ 3 = 4
     *
     * 12 ÷ ? = 4
     *
     * All answers are whole numbers.
     */

    function generateProblem() {

        const table = selectedTable;


        /*
         * Pick a multiplier from 1 to 12.
         */

        const multiplier =
            Math.floor(Math.random() * 12) + 1;


        /*
         * Calculate the product.
         */

        const product =
            table * multiplier;


        /*
         * Reset state.
         */

        correctAnswer = 0;

        answerSubmitted = false;

        lastEffectAnswer = null;

        document.getElementById("generateBtn").disabled = true;


        const equation =
            document.getElementById("equation");

        const message =
            document.getElementById("message");


        message.textContent = "";
        message.className = "";


        /*
         * Pick one of three question formats.
         *
         * 0 = product ÷ table = ?
         *
         * 1 = ? ÷ table = multiplier
         *
         * 2 = product ÷ ? = table
         */

        const questionType =
            Math.floor(Math.random() * 3);


        /*
         * ======================================
         * TYPE 1
         *
         * 9 ÷ 3 = ?
         *
         * Answer = 3
         * ======================================
         */

        if (questionType === 0) {

            correctAnswer = multiplier;


            equation.innerHTML = `

                <span>${product}</span>

                <span>÷</span>

                <span>${table}</span>

                <span>=</span>

                <input
                    type="number"
                    id="answer"
                    class="answer-input"
                    aria-label="Missing number"
                    autocomplete="off"
                >

            `;
        }


        /*
         * ======================================
         * TYPE 2
         *
         * ? ÷ 3 = 4
         *
         * Answer = 12
         * ======================================
         */

        else if (questionType === 1) {

            correctAnswer = product;


            equation.innerHTML = `

                <input
                    type="number"
                    id="answer"
                    class="answer-input"
                    aria-label="Missing number"
                    autocomplete="off"
                >

                <span>÷</span>

                <span>${table}</span>

                <span>=</span>

                <span>${multiplier}</span>

            `;
        }


        /*
         * ======================================
         * TYPE 3
         *
         * 12 ÷ ? = 4
         *
         * Answer = 3
         * ======================================
         */

        else {

            correctAnswer = table;


            equation.innerHTML = `

                <span>${product}</span>

                <span>÷</span>

                <input
                    type="number"
                    id="answer"
                    class="answer-input"
                    aria-label="Missing number"
                    autocomplete="off"
                >

                <span>=</span>

                <span>${multiplier}</span>

            `;
        }


        /*
         * Focus the answer box.
         */

        document
            .getElementById("answer")
            .focus();


        /*
         * Persist this question so it survives
         * a refresh or switching tables and back.
         */

        saveCurrentProblem(table);
    }


    /*
     * ==========================================
     * RESTORE OR GENERATE QUESTION
     * ==========================================
     *
     * If there is already an unanswered question
     * saved for this table, show that one again
     * instead of generating a new one. This stops
     * the user from "skipping" a question by
     * switching tables and back, or by refreshing.
     * ==========================================
     */

    function restoreOrGenerateProblem(table) {

        const state = loadState();

        const stored =
            state.problems && state.problems[table];


        if (!stored) {

            generateProblem();

            return;
        }


        correctAnswer = stored.correctAnswer;

        answerSubmitted = false;

        lastEffectAnswer = null;

        document.getElementById("generateBtn").disabled = true;


        const equation =
            document.getElementById("equation");

        const message =
            document.getElementById("message");


        message.textContent = "";
        message.className = "";

        equation.innerHTML = stored.equationHTML;


        document
            .getElementById("answer")
            .focus();
    }


    /*
     * ==========================================
     * SELECT TIMES TABLE
     * ==========================================
     */

    function setTable(table) {

        selectedTable = table;


        /*
         * Remove active state.
         */

        document
            .querySelectorAll(
                ".table-selector button"
            )
            .forEach(function(button) {

                button.classList.remove(
                    "active"
                );

            });


        /*
         * Activate selected table.
         */

        document
            .querySelector(
                `.table-selector button[data-table="${table}"]`
            )
            .classList.add("active");


        /*
         * Restore this table's unanswered question,
         * or generate a new one if it doesn't have one.
         */

        restoreOrGenerateProblem(table);
    }


    /*
     * ==========================================
     * SUBMIT ANSWER
     * ==========================================
     */

    function submitAnswer() {

        const input =
            document.getElementById("answer");

        const message =
            document.getElementById("message");


        /*
         * Empty answer.
         */

        if (input.value.trim() === "") {

            message.textContent =
                "Please enter an answer.";

            message.className =
                "incorrect";

            input.focus();

            return;
        }


        const userAnswer =
            Number(input.value);


        /*
         * ======================================
         * CORRECT
         * ======================================
         */

        if (userAnswer === correctAnswer) {

            /*
             * Only play the happy sound and
             * effect once per distinct answer.
             * Resubmitting the same answer
             * (e.g. pressing Submit again)
             * stays silent.
             */

            const isNewAnswer =
                userAnswer !== lastEffectAnswer;

            lastEffectAnswer = userAnswer;


            if (isNewAnswer) {

                playHappySound();

                /*
                 * Green flash
                 * + a random happy effect
                 */

                celebrateCorrectAnswer();
            }


            message.textContent =
                "Correct! 🎉";

            message.className =
                "correct";


            /*
             * Second Enter generates
             * the next question.
             */

            answerSubmitted = true;

            document.getElementById("generateBtn").disabled = false;
        }


        /*
         * ======================================
         * WRONG
         * ======================================
         */

        else {

            /*
             * Only play the sad sound and
             * red flash once per distinct
             * wrong answer.
             */

            const isNewAnswer =
                userAnswer !== lastEffectAnswer;

            lastEffectAnswer = userAnswer;


            if (isNewAnswer) {

                playSadSound();

                flashRed();
            }


            message.textContent =
                "Wrong! Try again.";

            message.className =
                "incorrect";


            /*
             * Stay on the same question.
             */

            answerSubmitted = false;

            input.focus();
        }
    }


    /*
     * ==========================================
     * TIMES TABLE BUTTONS
     * ==========================================
     */

    document
        .querySelectorAll(
            ".table-selector button"
        )
        .forEach(function(button) {

            button.addEventListener(
                "click",
                function() {

                    const table =
                        Number(
                            button.dataset.table
                        );

                    setTable(table);
                }
            );

        });


    /*
     * ==========================================
     * SUBMIT BUTTON
     * ==========================================
     */

    document
        .getElementById("submitBtn")
        .addEventListener(
            "click",
            function() {

                submitAnswer();

            }
        );


    /*
     * ==========================================
     * GENERATE BUTTON
     * ==========================================
     */

    document
        .getElementById("generateBtn")
        .addEventListener(
            "click",
            function() {

                generateProblem();

            }
        );


    /*
     * ==========================================
     * ENTER KEY
     * ==========================================
     *
     * First Enter:
     *     Submit
     *
     * Second Enter after correct:
     *     Generate
     *
     * Wrong answer:
     *     Enter remains Submit
     */

    document.addEventListener(
        "keydown",
        function(event) {

            if (event.key !== "Enter") {
                return;
            }

            event.preventDefault();


            if (answerSubmitted) {

                generateProblem();

            } else {

                submitAnswer();

            }

        }
    );


    /*
     * ==========================================
     * START GAME
     * ==========================================
     *
     * Starts on the 3 times table, unless a
     * previous table/question was saved.
     */

    (function startGame() {

        const state = loadState();

        const savedTable = state.selectedTable;

        const savedButton =
            savedTable &&
            document.querySelector(
                `.table-selector button[data-table="${savedTable}"]`
            );


        if (savedButton) {

            selectedTable = savedTable;

            document
                .querySelectorAll(".table-selector button")
                .forEach(function(button) {

                    button.classList.remove("active");

                });

            savedButton.classList.add("active");
        }


        restoreOrGenerateProblem(selectedTable);

    })();

</script>

</body>
</html>
