<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Times Table</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 900px;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;

            color: #333;
            font-size: 36px;
        }

        .images {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .images img {
            max-width: 100%;
            height: auto;

            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .back-link {
            display: inline-block;

            margin-top: 30px;

            padding: 14px 20px;

            border-radius: 10px;

            background: #333;
            color: white;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .back-link:hover {
            background: #555;
            transform: scale(1.02);
        }

        .back-link:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {

            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📋 Times Table</h1>

        <div class="images">
            <img src="images/times_table.png" alt="Times table chart">
            <img src="images/times_table_c.png" alt="Times table chart (colour)">
        </div>

        <a class="back-link" href="index.html">⬅ Back to Home</a>

    </div>

</body>
</html>
