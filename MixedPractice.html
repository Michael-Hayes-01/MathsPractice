<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixed Practice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.15s ease;
            overflow: hidden;
        }

        /* =========================
           GREEN FLASH - CORRECT
           ========================= */

        body.flash-green {
            animation: greenFlash 1.6s ease-in-out 1;
        }

        @keyframes greenFlash {
            0%, 100% {
                background-color: #f4f6f8;
            }

            7.5% {
                background-color: #32cd32;
            }

            15% {
                background-color: #f4f6f8;
            }

            22.5% {
                background-color: #32cd32;
            }

            30% {
                background-color: #f4f6f8;
            }

            37.5% {
                background-color: #32cd32;
            }

            45% {
                background-color: #f4f6f8;
            }

            52.5% {
                background-color: #32cd32;
            }

            60% {
                background-color: #f4f6f8;
            }

            67.5% {
                background-color: #32cd32;
            }

            75% {
                background-color: #f4f6f8;
            }

            82.5% {
                background-color: #32cd32;
            }

            90% {
                background-color: #f4f6f8;
            }
        }

        /* =========================
           RED FLASH - WRONG
           ========================= */

        body.flash-red {
            animation: redFlash 0.8s ease-in-out 1;
        }

        @keyframes redFlash {
            0%, 100% {
                background-color: #f4f6f8;
            }

            15% {
                background-color: #ff3b30;
            }

            30% {
                background-color: #f4f6f8;
            }

            45% {
                background-color: #ff3b30;
            }

            60% {
                background-color: #f4f6f8;
            }
        }

        /* =========================
           MAIN CONTAINER
           ========================= */

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 700px;
            position: relative;
            z-index: 2;
        }

        h1 {
            margin-bottom: 25px;
            color: #333;
        }

        /* =========================
           MODE TOGGLE
           ========================= */

        .toggle-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .toggle {
            display: flex;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }

        .toggle button {
            border: none;
            border-radius: 0;
            margin: 0;
            padding: 10px 18px;
            font-size: 18px;
            cursor: pointer;
            background: #eee;
            color: #333;
        }

        .toggle button:hover {
            background: #ddd;
        }

        .toggle button.active {
            background: #333;
            color: white;
        }

        /* =========================
           EQUATION
           ========================= */

        .equation {
            font-size: 42px;
            font-weight: bold;
            margin: 35px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .answer-input {
            width: 110px;
            height: 60px;
            font-size: 34px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #888;
            border-radius: 6px;
        }

        .answer-input:focus {
            outline: none;
            border-color: #333;
        }

        .answer-input::-webkit-inner-spin-button,
        .answer-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* =========================
           ACTION BUTTONS
           ========================= */

        .actions button {
            padding: 13px 30px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px;
        }

        #submitBtn {
            background: #333;
            color: white;
        }

        #submitBtn:hover {
            background: #555;
        }

        #generateBtn {
            background: #ddd;
            color: #333;
        }

        #generateBtn:hover {
            background: #ccc;
        }

        #generateBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           MESSAGE
           ========================= */

        #message {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            min-height: 28px;
        }

        .correct {
            color: green;
        }

        .incorrect {
            color: red;
        }

        /* =========================
           FIREWORKS
           ========================= */

        #fireworks {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .firework {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .spark {
            position: absolute;
            left: 0;
            top: 0;
            width: 6px;
            height: 22px;
            border-radius: 50%;
            transform-origin: 50% 100%;
            animation: sparkFly 850ms ease-out forwards;
        }

        @keyframes sparkFly {
            0% {
                transform:
                    rotate(var(--angle))
                    translateY(0)
                    scaleY(0.2);
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                transform:
                    rotate(var(--angle))
                    translateY(var(--distance))
                    scaleY(1);
                opacity: 0;
            }
        }

        /* =========================
           MOBILE
           ========================= */

        /* =========================
           HOME BUTTON
           ========================= */

        .home-button {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 5;
            padding: 10px 16px;
            border-radius: 8px;
            background: #333;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .home-button:hover {
            background: #555;
        }

        @media (max-width: 600px) {

            .container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 28px;
            }

            .toggle {
                flex-wrap: wrap;
                justify-content: center;
            }

            .toggle button {
                padding: 9px 10px;
                font-size: 15px;
            }

            .equation {
                font-size: 30px;
                gap: 8px;
            }

            .answer-input {
                width: 80px;
                height: 50px;
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<a class="home-button" href="index.html">🏠 Home</a>

<div id="fireworks"></div>

<div class="container">

    <h1>Mixed Practice</h1>

    <!-- =========================
         ADD / SUBTRACT / MULTIPLY /
         DIVIDE / RANDOM
         ========================= -->

    <div class="toggle-container">

        <div class="toggle">

            <button id="addBtn">
                Add +
            </button>

            <button id="subtractBtn">
                Subtract −
            </button>

            <button id="multiplyBtn">
                Multiply ×
            </button>

            <button id="divideBtn">
                Divide ÷
            </button>

            <button id="randomBtn" class="active">
                Random
            </button>

        </div>

    </div>

    <div class="equation" id="equation"></div>

    <div class="actions">

        <button id="submitBtn">
            Submit
        </button>

        <button id="generateBtn" disabled>
            Generate
        </button>

    </div>

    <div id="message"></div>

</div>


<script src="util.js"></script>

<script>

    /*
     * ==========================================
     * GAME STATE
     * ==========================================
     */

    let correctAnswer = 0;

    let answerSubmitted = false;

    let lastEffectAnswer = null;


    /*
     * ==========================================
     * PERSISTED STATE
     * ==========================================
     *
     * Remembers the unsolved question for each
     * mode (and which mode was active), so
     * switching modes and back - or refreshing
     * the page - restores it instead of letting
     * the user skip it.
     */

    const STORAGE_KEY = "mixedPracticeState";


    function loadState() {

        try {

            const raw =
                localStorage.getItem(STORAGE_KEY);

            return raw ? JSON.parse(raw) : {};

        } catch (e) {

            return {};
        }
    }


    function saveState() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify({
                    selectedMode: selectedMode,
                    pending: pending
                })
            );

        } catch (e) {}
    }


    const persistedState = loadState();

    /*
     * Unsolved questions, keyed by mode.
     */

    let pending =
        persistedState.pending || {};

    let selectedMode =
        persistedState.selectedMode || "random";


    function answerInputHTML() {

        return `
            <input
                type="number"
                id="answer"
                class="answer-input"
                aria-label="Missing number"
                autocomplete="off"
            >
        `;
    }


    /*
     * ==========================================
     * BUILD EQUATION
     *
     * Takes the three parts of "a op b = c"
     * and which one is missing (0, 1 or 2).
     * ==========================================
     */

    function buildEquation(a, operator, b, c, missing) {

        const parts = [a, b, c].map(function(value, index) {

            return index === missing
                ? answerInputHTML()
                : `<span>${value}</span>`;

        });

        return `
            ${parts[0]}
            <span>${operator}</span>
            ${parts[1]}
            <span>=</span>
            ${parts[2]}
        `;
    }


    /*
     * ==========================================
     * GENERATE PROBLEM
     * ==========================================
     */

    function generateProblem() {

        /*
         * Determine operation.
         *
         * Random picks any of the four
         * operations for each question.
         */

        const operations = [
            "add",
            "subtract",
            "multiply",
            "divide"
        ];

        const operation =
            selectedMode === "random"
                ? operations[Math.floor(Math.random() * operations.length)]
                : selectedMode;


        /*
         * Randomly choose which number is missing.
         *
         * 0 = first number
         * 1 = second number
         * 2 = answer
         */

        const missing =
            Math.floor(Math.random() * 3);


        let a;
        let b;
        let c;
        let operator;


        /*
         * ======================================
         * ADDITION: a + b = c  (a, b 1-50)
         * ======================================
         */

        if (operation === "add") {

            a = Math.floor(Math.random() * 50) + 1;
            b = Math.floor(Math.random() * 50) + 1;
            c = a + b;

            operator = "+";
        }


        /*
         * ======================================
         * SUBTRACTION: a − b = c  (a >= b)
         * ======================================
         */

        else if (operation === "subtract") {

            a = Math.floor(Math.random() * 50) + 1;
            b = Math.floor(Math.random() * a) + 1;
            c = a - b;

            operator = "−";
        }


        /*
         * ======================================
         * MULTIPLICATION / DIVISION
         *
         * Uses a random times table from 2-12
         * and another factor from 1-12, so all
         * division answers are whole numbers.
         * ======================================
         */

        else {

            const table =
                Math.floor(Math.random() * 11) + 2;

            const otherNumber =
                Math.floor(Math.random() * 12) + 1;

            const product =
                table * otherNumber;


            if (operation === "multiply") {

                /*
                 * Randomly put the table first
                 * or second.
                 */

                if (Math.random() < 0.5) {

                    a = table;
                    b = otherNumber;

                } else {

                    a = otherNumber;
                    b = table;
                }

                c = product;

                operator = "×";

            } else {

                a = product;
                b = table;
                c = otherNumber;

                operator = "÷";
            }
        }


        correctAnswer =
            [a, b, c][missing];

        answerSubmitted = false;

        lastEffectAnswer = null;

        document.getElementById("generateBtn").disabled = true;


        const equation =
            document.getElementById("equation");

        const message =
            document.getElementById("message");


        message.textContent = "";
        message.className = "";


        equation.innerHTML =
            buildEquation(a, operator, b, c, missing);


        /*
         * Remember this as the unsolved
         * question for the current mode.
         */

        pending[selectedMode] = {
            equationHTML: equation.innerHTML,
            correctAnswer: correctAnswer
        };

        saveState();


        document
            .getElementById("answer")
            .focus();
    }


    /*
     * ==========================================
     * LOAD QUESTION
     *
     * Restores the unsolved question left
     * behind for this mode, or generates a
     * new one if there isn't one.
     * ==========================================
     */

    function loadQuestion() {

        const saved =
            pending[selectedMode];

        if (!saved) {

            generateProblem();

            return;
        }


        correctAnswer =
            saved.correctAnswer;


        const message =
            document.getElementById("message");


        document.getElementById("equation").innerHTML =
            saved.equationHTML;

        message.textContent = "";
        message.className = "";


        answerSubmitted = false;

        lastEffectAnswer = null;

        document.getElementById("generateBtn").disabled = true;


        document
            .getElementById("answer")
            .focus();
    }


    /*
     * ==========================================
     * MODE BUTTONS
     * ==========================================
     */

    const MODE_BUTTON_IDS = {
        add: "addBtn",
        subtract: "subtractBtn",
        multiply: "multiplyBtn",
        divide: "divideBtn",
        random: "randomBtn"
    };


    function updateActiveButtons() {

        Object.keys(MODE_BUTTON_IDS).forEach(function(mode) {

            document
                .getElementById(MODE_BUTTON_IDS[mode])
                .classList.toggle(
                    "active",
                    mode === selectedMode
                );

        });
    }


    function setMode(mode) {

        selectedMode = mode;

        saveState();

        updateActiveButtons();

        loadQuestion();
    }


    Object.keys(MODE_BUTTON_IDS).forEach(function(mode) {

        document
            .getElementById(MODE_BUTTON_IDS[mode])
            .addEventListener(
                "click",
                function() {

                    setMode(mode);

                }
            );

    });


    /*
     * ==========================================
     * SUBMIT ANSWER
     * ==========================================
     */

    function submitAnswer() {

        const input =
            document.getElementById("answer");

        const message =
            document.getElementById("message");


        /*
         * Empty answer.
         */

        if (input.value.trim() === "") {

            message.textContent =
                "Please enter an answer.";

            message.className =
                "incorrect";

            input.focus();

            return;
        }


        const userAnswer =
            Number(input.value);


        /*
         * ======================================
         * CORRECT
         * ======================================
         */

        if (userAnswer === correctAnswer) {

            /*
             * Only play the happy sound and
             * effect once per distinct answer.
             */

            const isNewAnswer =
                userAnswer !== lastEffectAnswer;

            lastEffectAnswer = userAnswer;


            if (isNewAnswer) {

                playHappySound();

                celebrateCorrectAnswer();
            }


            message.textContent =
                "Correct! 🎉";

            message.className =
                "correct";


            /*
             * Next Enter generates
             * a new question.
             */

            answerSubmitted = true;

            document.getElementById("generateBtn").disabled = false;


            /*
             * Solved - nothing left to
             * remember for this mode.
             */

            delete pending[selectedMode];

            saveState();
        }


        /*
         * ======================================
         * WRONG
         * ======================================
         */

        else {

            /*
             * Only play the sad sound and
             * red flash once per distinct
             * wrong answer.
             */

            const isNewAnswer =
                userAnswer !== lastEffectAnswer;

            lastEffectAnswer = userAnswer;


            if (isNewAnswer) {

                playSadSound();

                flashRed();
            }


            message.textContent =
                "Wrong! Try again.";

            message.className =
                "incorrect";


            answerSubmitted = false;

            input.focus();
        }
    }


    /*
     * ==========================================
     * SUBMIT / GENERATE BUTTONS
     * ==========================================
     */

    document
        .getElementById("submitBtn")
        .addEventListener(
            "click",
            function() {

                submitAnswer();

            }
        );


    document
        .getElementById("generateBtn")
        .addEventListener(
            "click",
            function() {

                generateProblem();

            }
        );


    /*
     * ==========================================
     * ENTER KEY
     * ==========================================
     *
     * First Enter:
     *     Submit
     *
     * Second Enter after correct:
     *     Generate
     *
     * Wrong answer:
     *     Enter remains Submit
     */

    document.addEventListener(
        "keydown",
        function(event) {

            if (event.key !== "Enter") {
                return;
            }


            event.preventDefault();


            if (answerSubmitted) {

                generateProblem();

            } else {

                submitAnswer();

            }

        }
    );


    /*
     * ==========================================
     * START GAME
     * ==========================================
     *
     * Starts on Random, unless a previous
     * mode was saved.
     */

    (function startGame() {

        updateActiveButtons();

        loadQuestion();

    })();

</script>

</body>
</html>
