<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Practice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.15s ease;
            overflow: hidden;
        }

        /* =========================
           GREEN FLASH - CORRECT
           ========================= */

        body.flash-green {
            animation: greenFlash 1.6s ease-in-out 1;
        }

        @keyframes greenFlash {
            0%, 100% {
                background-color: #f4f6f8;
            }

            7.5% {
                background-color: #32cd32;
            }

            15% {
                background-color: #f4f6f8;
            }

            22.5% {
                background-color: #32cd32;
            }

            30% {
                background-color: #f4f6f8;
            }

            37.5% {
                background-color: #32cd32;
            }

            45% {
                background-color: #f4f6f8;
            }

            52.5% {
                background-color: #32cd32;
            }

            60% {
                background-color: #f4f6f8;
            }

            67.5% {
                background-color: #32cd32;
            }

            75% {
                background-color: #f4f6f8;
            }

            82.5% {
                background-color: #32cd32;
            }

            90% {
                background-color: #f4f6f8;
            }
        }

        /* =========================
           RED FLASH - WRONG
           ========================= */

        body.flash-red {
            animation: redFlash 0.8s ease-in-out 1;
        }

        @keyframes redFlash {
            0%, 100% {
                background-color: #f4f6f8;
            }

            15% {
                background-color: #ff3b30;
            }

            30% {
                background-color: #f4f6f8;
            }

            45% {
                background-color: #ff3b30;
            }

            60% {
                background-color: #f4f6f8;
            }
        }

        /* =========================
           MAIN CONTAINER
           ========================= */

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 650px;
            position: relative;
            z-index: 2;
        }

        h1 {
            margin-bottom: 8px;
            color: #333;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 25px;
        }

        /* =========================
           WORD SET SELECTOR
           ========================= */

        .set-selector {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }

        .set-selector button {
            height: 42px;
            padding: 0 12px;
            border: 2px solid #333;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #eee;
            color: #333;
        }

        .set-selector button:hover {
            background: #ddd;
        }

        .set-selector button.active {
            background: #333;
            color: white;
        }

        /* =========================
           PASTE A NEW WORD SET
           ========================= */

        .small-button {
            padding: 4px 10px;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background: #eee;
            color: #333;
        }

        .small-button:hover {
            background: #ddd;
        }

        .add-set {
            margin-bottom: 10px;
        }

        /*
         * The page doesn't scroll, so hide the
         * game while the paste panel is open.
         */

        .container.adding-set .word-area,
        .container.adding-set .actions,
        .container.adding-set #message,
        .container.adding-set #progress {
            display: none;
        }

        .add-set-panel {
            text-align: left;
            background: #f4f6f8;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .add-set-panel label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin: 8px 0 4px;
        }

        .add-set-panel input,
        .add-set-panel textarea {
            width: 100%;
            font-size: 16px;
            font-family: Arial, sans-serif;
            padding: 8px;
            border: 2px solid #888;
            border-radius: 6px;
        }

        .add-set-panel textarea {
            resize: vertical;
        }

        .add-set-panel input:focus,
        .add-set-panel textarea:focus {
            outline: none;
            border-color: #333;
        }

        .add-set-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }

        #saveSetBtn {
            background: #2e9e44;
            border-color: #2e9e44;
            color: white;
        }

        #saveSetBtn:hover {
            background: #237a34;
        }

        #addSetError {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
            min-height: 17px;
        }

        .custom-set-list {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }

        .custom-set-list div {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
        }

        #progress {
            color: #888;
            font-size: 15px;
            min-height: 18px;
        }

        /* =========================
           WORD
           ========================= */

        .word-area {
            margin: 30px 0;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .word {
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #333;
        }

        .definition {
            font-size: 18px;
            color: #666;
            font-style: italic;
            max-width: 480px;
        }

        .spell-input {
            width: 100%;
            max-width: 380px;
            height: 70px;
            font-size: 40px;
            text-align: center;
            letter-spacing: 2px;
            border: 2px solid #888;
            border-radius: 6px;
        }

        .spell-input:focus {
            outline: none;
            border-color: #333;
        }

        .hidden {
            display: none;
        }

        /* =========================
           ACTION BUTTONS
           ========================= */

        .actions button {
            padding: 12px 28px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px;
            background: #2e9e44;
            color: white;
        }

        .actions button:hover {
            background: #237a34;
        }

        /* =========================
           MESSAGE
           ========================= */

        #message {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            min-height: 28px;
        }

        .correct {
            color: green;
        }

        .incorrect {
            color: red;
        }

        /* =========================
           FIREWORKS
           ========================= */

        #fireworks {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .firework {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .spark {
            position: absolute;
            left: 0;
            top: 0;
            width: 6px;
            height: 22px;
            border-radius: 50%;
            transform-origin: 50% 100%;
            animation: sparkFly 850ms ease-out forwards;
        }

        @keyframes sparkFly {
            0% {
                transform:
                    rotate(var(--angle))
                    translateY(0)
                    scaleY(0.2);
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                transform:
                    rotate(var(--angle))
                    translateY(var(--distance))
                    scaleY(1);
                opacity: 0;
            }
        }

        /* =========================
           HOME BUTTON
           ========================= */

        .top-buttons {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 10px;
        }

        .home-button {
            padding: 10px 16px;
            border-radius: 8px;
            background: #333;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .home-button:hover {
            background: #555;
        }

        .home-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-icon {
            font-size: 26px;
            line-height: 1;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 28px;
            }

            .set-selector button {
                height: 38px;
                font-size: 15px;
                padding: 0 10px;
            }

            .word {
                font-size: 44px;
            }

            .spell-input {
                height: 58px;
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<!-- Fireworks are created here -->
<div id="fireworks"></div>

<div class="container">

    <h1>Spelling Practice</h1>

    <div class="subtitle">
        See it, Say it, Spell it
    </div>

    <!-- =========================
         WORD SETS (one button per
         set in words/words.js, plus
         any pasted in)
         ========================= -->

    <div class="set-selector" id="setSelector"></div>

    <div class="add-set">
        <button id="addSetBtn" class="small-button">
            ➕ Paste a new word set
        </button>
    </div>

    <div id="addSetPanel" class="add-set-panel hidden">

        <label for="newSetName">Name</label>

        <input
                type="text"

        >

        <label for="newSetWords">Words</label>

        <textarea
                id="newSetWords"

                placeholder="One word per line, with an optional definition:&#10;because – Explains why something happens.&#10;friend&#10;&#10;or separated by commas: because, friend, people"
        ></textarea>

        <div class="add-set-actions">

            <button id="saveSetBtn" class="small-button">

            </button>

    <!-- =========================
         WORD / ANSWER BOX
         ========================= -->

    <div class="word-area">

        <div class="word" id="word"></div>

        <input
                type="text"
                id="answer"
                class="spell-input hidden"
                aria-label="Spell the word"
                autocomplete="off"

                autocapitalize="off"
                spellcheck="false"
        >

        <div class="definition" id="definition"></div>

    </div>

    <!-- =========================
         ACTION BUTTONS
         ========================= -->

    <div class="actions">

        <button id="saidItBtn" class="hidden">
            OK - I'm ready!
        </button>

        <button id="submitBtn" class="hidden">

        </button>

        </button>

    </div>

    <!-- Feedback -->

</div>


<script src="util.js"></script>

<script>

    /*
     * words/words.js calls addWordSet once for
     * each word set. It's a script (not .txt
     * files) so it still loads when this page
     * is opened by double-clicking it.
     */

    const WORD_SET_TEXTS = [];

    function addWordSet(name, text) {

        WORD_SET_TEXTS.push({
            name: name,
            text: text
        });
    }

</script>

<script src="words/words.js"></script>

<script>

    /*
     * ==========================================
     * GAME STATE
     * ==========================================
     *
     * Each word goes through these stages:
     *
     * "see"  - the word is shown, the child
     *          says it out loud, then clicks
     *          "OK - I'm ready!" (or Enter)
     * "type" - the word is hidden and the
     *          child types it
     * "done" - spelled correctly; moves on to
     *          the next word after a moment
     *
     * A wrong spelling goes back to "see" with
     * the same word.
     */

    const NEXT_WORD_DELAY = 2500;

    let wordSets = [];

    let queue = [];

    let queueIndex = 0;

    let stage = null;

    let nextWordTimer = null;


    /*
     * ==========================================
     * PERSISTED STATE
     * ==========================================
     *
     * Remembers which word sets are selected
     * (by name), and for each selection the
     * shuffled word order and which word is
     * being practised - so refreshing the page
     * (or switching sets and back) shows the
     * same word until it is spelled correctly,
     * instead of skipping it.
     */

    const STORAGE_KEY = "spellingPracticeState";


    function loadState() {

        try {

            const raw =
                localStorage.getItem(STORAGE_KEY);

            return raw ? JSON.parse(raw) : {};

        } catch (e) {

            return {};
        }
    }


    function saveState() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify({
                    selectedSets: selectedSets,
                    rounds: rounds
                })
            );

        } catch (e) {}
    }


    const persistedState = loadState();

    /*
     * Either "all" or a list of set names.
     */

    let selectedSets =
        persistedState.selectedSets || "all";

    /*
     * Saved rounds by selection:
     *
     *     { "all": { words: ["happy", ...], index: 3 } }
     */

    let rounds =
        persistedState.rounds || {};


    /*
     * ==========================================
     * READ A WORD LIST
     * ==========================================
     *
     * One word per line, optionally followed by
     * a definition after a dash:
     *
     *     because – Explains why something happens.
     *
     * Blank lines and lines starting with #
     * are ignored.
     *
     * To make pasted lists work too: numbering
     * or bullets ("1.", "2)", "-", "•") are
     * removed, and a line without a definition
     * can hold several words separated by
     * commas, semicolons or tabs.
     */

    function parseWordList(text) {

        const words = [];

        function addWord(word, definition) {

            word = word.trim().replace(/[.,;:!?]+$/, "");

            if (word !== "") {

                words.push({
                    word: word,
                    definition: definition
                });
            }
        }

        text.split(/\r?\n/).forEach(function (line) {

            line = line
                .trim()
                .replace(/^(\d+[.)]|[-–•*])\s+/, "");

            if (line === "" || line.startsWith("#")) {
                return;
            }

            const parts = line.split(/\s+[–—-]\s+/);

            if (parts.length > 1) {

                addWord(
                    parts[0],
                    parts.slice(1).join(" – ").trim()
                );

            } else {

                line.split(/[,;\t]+/).forEach(function (word) {
                    addWord(word, "");
                });
            }

        });

        return words;
    }


    /*
     * ==========================================
     * PASTED WORD SETS
     * ==========================================
     *
     * A page opened from a file can't change
     * words.js, so pasted sets are kept in this
     * browser. Each is { name, text }, with the
     * text as pasted.
     */

    const CUSTOM_SETS_KEY = "spellingCustomSets";


    function loadCustomSets() {

        try {

            const parsed = JSON.parse(
                localStorage.getItem(CUSTOM_SETS_KEY)
            );

            return Array.isArray(parsed) ? parsed : [];

        } catch (e) {

            return [];
        }
    }


    function saveCustomSets() {

        try {

            localStorage.setItem(
                CUSTOM_SETS_KEY,
                JSON.stringify(customSets)
            );

        } catch (e) {}
    }


    let customSets = loadCustomSets();


    /*
     * The sets from words.js, then the pasted
     * ones (skipping any whose name words.js
     * now uses).
     */

    function buildWordSets() {

        const fileSets =
            WORD_SET_TEXTS.map(function (set) {
                return {
                    name: set.name,
                    words: parseWordList(set.text)
                };
            });

        const pastedSets = customSets
            .filter(function (set) {
                return !fileSets.some(function (fileSet) {
                    return fileSet.name === set.name;
                });
            })
            .map(function (set) {
                return {
                    name: set.name,
                    words: parseWordList(set.text)
                };
            });

        wordSets = fileSets
            .concat(pastedSets)
            .filter(function (set) {
                return set.words.length > 0;
            });
    }


    function showAddSetError(text) {

        document.getElementById("addSetError").textContent = text;
    }


    function openAddSetPanel() {

        document.getElementById("addSetPanel").classList.remove("hidden");

        document.getElementById("addSetBtn").classList.add("hidden");

        document.querySelector(".container").classList.add("adding-set");

        showAddSetError("");

        renderCustomSetList();

        document.getElementById("newSetName").focus();
    }


    function closeAddSetPanel() {

        document.getElementById("addSetPanel").classList.add("hidden");

        document.getElementById("addSetBtn").classList.remove("hidden");

        document.querySelector(".container").classList.remove("adding-set");

        document.getElementById("newSetName").value = "";

        document.getElementById("newSetWords").value = "";
    }


    function saveNewSet() {

        const name =
            document.getElementById("newSetName").value.trim();

        const text =
            document.getElementById("newSetWords").value;


        if (name === "") {

            showAddSetError("Please give the word set a name.");

            return;
        }

        const nameTaken =
            name.toLowerCase() === "all" ||
            wordSets.some(function (set) {
                return set.name.toLowerCase() === name.toLowerCase();
            });

        if (nameTaken) {

            showAddSetError(`There is already a word set called "${name}".`);

            return;
        }

        if (parseWordList(text).length === 0) {

            showAddSetError("Please paste in some words.");

            return;
        }


        customSets.push({
            name: name,
            text: text
        });

        saveCustomSets();

        buildWordSets();


        /*
         * Start practising the new set.
         */

        selectedSets = [name];

        closeAddSetPanel();

        renderSetSelector();

        startRound(false);
    }


    function deleteCustomSet(name) {

        if (!confirm(`Delete the word set "${name}"?`)) {
            return;
        }

        customSets =
            customSets.filter(function (set) {
                return set.name !== name;
            });

        saveCustomSets();

        buildWordSets();


        if (Array.isArray(selectedSets)) {

            selectedSets =
                selectedSets.filter(function (n) {
                    return n !== name;
                });

            if (selectedSets.length === 0) {
                selectedSets = "all";
            }
        }

        renderSetSelector();

        renderCustomSetList();

        startRound(false);
    }


    /*
     * The pasted sets, each with a Delete
     * button, shown in the paste panel.
     */

    function renderCustomSetList() {

        const list =
            document.getElementById("customSetList");

        list.innerHTML = "";

        if (customSets.length === 0) {
            return;
        }

        const heading =
            document.createElement("strong");

        heading.textContent = "Pasted word sets";

        list.appendChild(heading);


        customSets.forEach(function (set) {

            const row =
                document.createElement("div");

            const label =
                document.createElement("span");

            label.textContent =
                `${set.name} (${parseWordList(set.text).length} words)`;

            const button =
                document.createElement("button");

            button.className = "small-button";

            button.textContent = "✕ Delete";

            button.addEventListener("click", function () {

                deleteCustomSet(set.name);

            });

            row.appendChild(label);

            row.appendChild(button);

            list.appendChild(row);

        });
    }


    /*
     * ==========================================
     * WORD SET BUTTONS
     * ==========================================
     *
     * Works like the times table selector:
     *
     * "All" replaces the selection.
     *
     * A set toggles on/off, but the last
     * selected set can't be turned off.
     */

    function renderSetSelector() {

        const selector =
            document.getElementById("setSelector");

        selector.innerHTML = "";


        function addButton(label, name) {

            const button =
                document.createElement("button");

            button.textContent = label;

            button.dataset.set = name;

            button.addEventListener("click", function () {

                toggleSet(name);

                button.blur();

            });

            selector.appendChild(button);
        }


        wordSets.forEach(function (set) {

            addButton(
                `${set.name} (${set.words.length})`,
                set.name
            );

        });

        addButton("All", "all");

        updateSetButtons();
    }


    function updateSetButtons() {

        document
            .querySelectorAll(".set-selector button")
            .forEach(function (button) {

                const name = button.dataset.set;

                button.classList.toggle(
                    "active",
                    selectedSets === "all"
                        ? name === "all"
                        : selectedSets.includes(name)
                );

            });
    }


    function toggleSet(name) {

        if (name === "all") {

            selectedSets = "all";

        } else if (selectedSets === "all") {

            selectedSets = [name];

        } else if (selectedSets.includes(name)) {

            if (selectedSets.length === 1) {
                return;
            }

            selectedSets =
                selectedSets.filter(function (n) {
                    return n !== name;
                });

        } else {

            /*
             * Keep them in words.js order.
             */

            selectedSets =
                wordSets
                    .map(function (set) {
                        return set.name;
                    })
                    .filter(function (n) {
                        return n === name || selectedSets.includes(n);
                    });
        }

        saveState();

        updateSetButtons();

        startRound(false);
    }


    /*
     * ==========================================
     * WORD QUEUE
     * ==========================================
     *
     * Every word from the selected sets, once
     * each (sets can share words), shuffled.
     * When all have been spelled, reshuffle
     * and go round again.
     *
     * Each selection of sets has its own saved
     * round, so it carries on from the word it
     * was on.
     */

    function shuffle(items) {

        for (let i = items.length - 1; i > 0; i--) {

            const j = Math.floor(Math.random() * (i + 1));

            [items[i], items[j]] = [items[j], items[i]];
        }

        return items;
    }


    function selectionKey() {

        return selectedSets === "all"
            ? "all"
            : selectedSets.join("|");
    }


    function selectedWords() {

        const seen = new Set();

        const words = [];

        wordSets.forEach(function (set) {

            if (
                selectedSets !== "all" &&
                !selectedSets.includes(set.name)
            ) {
                return;
            }

            set.words.forEach(function (entry) {

                const key = entry.word.toLowerCase();

                if (!seen.has(key)) {

                    seen.add(key);

                    words.push(entry);
                }

            });

        });

        return words;
    }


    function saveRound() {

        rounds[selectionKey()] = {
            words: queue.map(function (entry) {
                return entry.word;
            }),
            index: queueIndex
        };

        saveState();
    }


    /*
     * Carries on this selection's saved round,
     * or shuffles a new one (always, when
     * newRound is true).
     *
     * A saved round is only used if it still
     * has exactly the selected words - after
     * words.js is edited it starts afresh.
     */

    function startRound(newRound) {

        const words = selectedWords();


        /*
         * No word sets at all (empty words.js
         * and nothing pasted).
         */

        if (words.length === 0) {

            showNoWords();

            return;
        }

        const saved = rounds[selectionKey()];

        const byWord = new Map(
            words.map(function (entry) {
                return [entry.word, entry];
            })
        );

        const savedFits =
            !newRound &&
            saved &&
            Array.isArray(saved.words) &&
            saved.words.length === words.length &&
            new Set(saved.words).size === words.length &&
            saved.words.every(function (word) {
                return byWord.has(word);
            }) &&
            saved.index >= 0 &&
            saved.index < words.length;

        if (savedFits) {

            queue =
                saved.words.map(function (word) {
                    return byWord.get(word);
                });

            queueIndex = saved.index;

        } else {

            queue = shuffle(words);

            queueIndex = 0;
        }

        saveRound();

        showWord();
    }


    function currentWord() {

        return queue[queueIndex];
    }


    function nextWord() {

        clearTimeout(nextWordTimer);

        queueIndex++;

        if (queueIndex >= queue.length) {

            startRound(true);

            return;
        }

        saveRound();

        showWord();
    }


    /*
     * ==========================================
     * SHOW A NEW WORD
     * ==========================================
     */

    function showNoWords() {

        clearTimeout(nextWordTimer);

        stage = null;

        ["word", "answer", "saidItBtn", "submitBtn", "nextBtn"]
            .forEach(function (id) {
                document.getElementById(id).classList.add("hidden");
            });

        document.getElementById("definition").textContent = "";

        document.getElementById("progress").textContent = "";

        const message =
            document.getElementById("message");

        message.textContent =
            "No words yet - paste a word set to get started.";

        message.className =
            "incorrect";
    }


    function showWord() {

        const message =
            document.getElementById("message");

        message.textContent = "";

        message.className = "";

        document.getElementById("progress").textContent =
            `Word ${queueIndex + 1} of ${queue.length}`;

        showSeeStage();
    }


    /*
     * ==========================================
     * STAGE 1: SEE IT AND SAY IT
     * ==========================================
     */

    function showSeeStage() {

        clearTimeout(nextWordTimer);

        stage = "see";

        const entry = currentWord();

        const word =
            document.getElementById("word");

        word.textContent = entry.word;

        word.classList.remove("hidden");

        document.getElementById("definition").textContent =
            entry.definition;

        document.getElementById("answer").classList.add("hidden");

        document.getElementById("saidItBtn").classList.remove("hidden");

        document.getElementById("submitBtn").classList.add("hidden");

        document.getElementById("nextBtn").classList.add("hidden");
    }


    /*
     * ==========================================
     * STAGE 2: HIDE IT AND SPELL IT
     * ==========================================
     *
     * The definition stays as a clue.
     */

    function showTypeStage() {

        stage = "type";

        const message =
            document.getElementById("message");

        message.textContent = "";

        message.className = "";

        document.getElementById("word").classList.add("hidden");

        document.getElementById("saidItBtn").classList.add("hidden");

        document.getElementById("submitBtn").classList.remove("hidden");


        const input =
            document.getElementById("answer");

        input.value = "";

        input.classList.remove("hidden");

        input.focus();
    }


    /*
     * ==========================================
     * SUBMIT SPELLING
     * ==========================================
     */

    function submitSpelling() {

        const input =
            document.getElementById("answer");

        const message =
            document.getElementById("message");

        const attempt =
            input.value.trim();


        /*
         * Nothing typed.
         */

        if (attempt === "") {

            message.textContent =
                "Please type the word.";

            message.className =
                "incorrect";

            input.focus();

            return;
        }


        const entry = currentWord();


        /*
         * ======================================
         * CORRECT
         * ======================================
         */

        if (attempt.toLowerCase() === entry.word.toLowerCase()) {

            stage = "done";

            playHappySound();

            /*
             * Green flash
             * + a random happy effect
             */

            celebrateCorrectAnswer();


            message.textContent =
                "Correct! 🎉";

            message.className =
                "correct";


            /*
             * Show the word again next to the
             * correct message, then move on.
             * Enter (or Next) moves on straight
             * away.
             */

            input.classList.add("hidden");

            document.getElementById("word").classList.remove("hidden");

            document.getElementById("submitBtn").classList.add("hidden");

            document.getElementById("nextBtn").classList.remove("hidden");


            /*
             * Solved - a refresh now goes on to
             * the next word.
             */

            if (queueIndex + 1 < queue.length) {

                rounds[selectionKey()].index = queueIndex + 1;

            } else {

                delete rounds[selectionKey()];
            }

            saveState();


            nextWordTimer =
                setTimeout(nextWord, NEXT_WORD_DELAY);
        }


        /*
         * ======================================
         * WRONG
         *
         * Show the same word again to see
         * and say, then try again.
         * ======================================
         */

        else {

            playSadSound();

            flashRed();


            message.textContent =
                `Not quite - you wrote "${attempt}". Look again!`;

            message.className =
                "incorrect";


            showSeeStage();
        }
    }


    /*
     * ==========================================
     * BUTTONS
     * ==========================================
     */

    document
        .getElementById("saidItBtn")
        .addEventListener(
            "click",
            function () {

                showTypeStage();

            }
        );


    document
        .getElementById("submitBtn")
        .addEventListener(
            "click",
            function () {

                submitSpelling();

            }
        );


    document
        .getElementById("nextBtn")
        .addEventListener(
            "click",
            function () {

                nextWord();

            }
        );


    document
        .getElementById("addSetBtn")
        .addEventListener(
            "click",
            function () {

                openAddSetPanel();

            }
        );


    document
        .getElementById("saveSetBtn")
        .addEventListener(
            "click",
            function () {

                saveNewSet();

            }
        );


    document
        .getElementById("cancelSetBtn")
        .addEventListener(
            "click",
            function () {

                closeAddSetPanel();

            }
        );


    /*
     * ==========================================
     * ENTER KEY
     * ==========================================
     *
     * See it:     OK - I'm ready
     * Spell it:   Submit
     * Correct:    Next word
     */

    document.addEventListener(
        "keydown",
        function (event) {

            if (event.key !== "Enter" || stage === null) {
                return;
            }

            /*
             * Typing in the paste panel - Enter
             * there is a new line, not the game.
             */

            if (event.target.closest("#addSetPanel")) {
                return;
            }


            event.preventDefault();


            if (stage === "see") {

                showTypeStage();

            } else if (stage === "type") {

                submitSpelling();

            } else {

                nextWord();

            }

        }
    );


    /*
     * ==========================================
     * START GAME
     * ==========================================
     *
     * Starts with every word set selected,
     * unless a previous selection was saved.
     */

    (function startGame() {

        buildWordSets();


        /*
         * Forget saved sets that have since
         * been removed or renamed.
         */

        if (Array.isArray(selectedSets)) {

            selectedSets =
                selectedSets.filter(function (name) {
                    return wordSets.some(function (set) {
                        return set.name === name;
                    });
                });

            if (selectedSets.length === 0) {
                selectedSets = "all";
            }

        } else {

            selectedSets = "all";
        }

        saveState();


        renderSetSelector();

        startRound(false);

    })();

</script>
